// 3. Controladores de Zoom, Pan e Botões do Cabeçalho
const svg = document.getElementById('blueprint');
const world = document.getElementById('world');
const vp = document.getElementById('viewport');
const tip = document.getElementById('tip');
const zoomInd = document.getElementById('zoomIndicator');

let scale = 1.0, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;

function applyTransform() {
  world.setAttribute('transform', `translate(${tx} ${ty}) scale(${scale})`);
  if (zoomInd) zoomInd.textContent = `${Math.round(scale * 100)}%`;
}

function zoom(factor, cx = 1100, cy = 750) {
  const nextScale = Math.max(0.35, Math.min(3.5, scale * factor));
  tx = cx - (cx - tx) * (nextScale / scale);
  ty = cy - (cy - ty) * (nextScale / scale);
  scale = nextScale;
  applyTransform();
}

document.getElementById('zoomIn').addEventListener('click', () => zoom(1.25));
document.getElementById('zoomOut').addEventListener('click', () => zoom(0.8));
document.getElementById('reset').addEventListener('click', () => {
  scale = 1.0;
  tx = 0;
  ty = 0;
  applyTransform();
  tip.textContent = 'Visualização restaurada para 100% · Arraste para mover';
});

// Zoom com roda do rato
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = ((e.clientX - rect.left) / rect.width) * 2200;
  const my = ((e.clientY - rect.top) / rect.height) * 1500;
  zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, mx, my);
}, { passive: false });

// Arrastar (Pan) no canvas SVG
svg.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  dragging = true;
  vp.classList.add('dragging');
  sx = e.clientX;
  sy = e.clientY;
  ox = tx;
  oy = ty;
  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener('pointermove', e => {
  if (!dragging) return;
  const rect = svg.getBoundingClientRect();
  tx = ox + (e.clientX - sx) * (2200 / rect.width);
  ty = oy + (e.clientY - sy) * (1500 / rect.height);
  applyTransform();
});

svg.addEventListener('pointerup', e => {
  dragging = false;
  vp.classList.remove('dragging');
  if (svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId);
});

// Destaque interativo das trilhas
document.querySelectorAll('.trace').forEach(t => {
  t.addEventListener('mouseenter', () => {
    t.classList.add('active');
    const netName = t.getAttribute('data-net') || 'Trilha selecionada';
    tip.textContent = `Trilha Ativa: ${netName}`;
  });
  t.addEventListener('mouseleave', () => {
    t.classList.remove('active');
    tip.textContent = 'Passe o rato sobre uma trilha para destacá-la · Arraste para mover · Roda do rato ou botões para zoom';
  });
});

// Exportar SVG autónomo (com estilos CSS embutidos)
document.getElementById('download').addEventListener('click', () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', NS);
  const styleEl = document.createElementNS(NS, 'style');
  styleEl.textContent = document.querySelector('style').textContent;
  clone.insertBefore(styleEl, clone.firstChild);

  const blob = new Blob([new XMLSerializer().serializeToString(clone)], { type: 'image/svg+xml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Cleitin_Core_v2_Blueprint.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  tip.textContent = 'Ficheiro Cleitin_Core_v2_Blueprint.svg exportado com sucesso!';
});

applyTransform();
